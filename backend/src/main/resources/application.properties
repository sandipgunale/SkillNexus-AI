spring.application.name=skillnexus-ai

# =========================================================
# Server
# =========================================================

# Render provides PORT automatically.
# Local development falls back to 8080.
server.port=${PORT:8080}


# =========================================================
# MySQL - Application Database
# =========================================================

# Local:
# jdbc:mysql://localhost:3306/careermetric
#
# Production:
# Set DB_URL in Render environment variables.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careermetric}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000


# =========================================================
# Google Authentication
# =========================================================

google.client-id=${GOOGLE_CLIENT_ID}


# =========================================================
# Resume Storage
# =========================================================

app.storage.resume-dir=storage/resumes

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# =========================================================
# Spring AI - Model Provider Selection
# =========================================================

# Groq (OpenAI-compatible API) -> Chat / LLM
# Google GenAI -> Embeddings

spring.ai.model.chat=openai
spring.ai.model.embedding.text=google-genai


# =========================================================
# Groq - Chat / LLM
# =========================================================

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.chat.reasoning-effort=low


# =========================================================
# Google GenAI - Embeddings
# =========================================================

# Gemini API key is provided through an environment variable.
# Never hard-code the API key in this file.

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Gemini embedding model.
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

# Keep 1024 dimensions to match the existing PGVector setup.
spring.ai.google.genai.embedding.text.dimensions=1024

# Automatically truncate text that exceeds the model limit.
spring.ai.google.genai.embedding.text.auto-truncate=true


# =========================================================
# PostgreSQL - PGVector
# =========================================================

# Local:
# jdbc:postgresql://localhost:5432/postgres
#
# Production:
# Set PGVECTOR_DB_URL in Render.

pgvector.datasource.jdbc-url=${PGVECTOR_DB_URL:jdbc:postgresql://localhost:5432/postgres}
pgvector.datasource.username=${PGVECTOR_DB_USERNAME}
pgvector.datasource.password=${PGVECTOR_DB_PASSWORD}
pgvector.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# PGVector Auto-Configuration
# =========================================================

# We configure the PGVector VectorStore manually because
# MySQL is the application's primary datasource.

spring.ai.vectorstore.type=custom